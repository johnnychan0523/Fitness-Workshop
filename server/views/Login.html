<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 健身工作坊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f9fafb;
            font-family: 'Noto Sans TC', Arial, sans-serif;
            color: #111827;
        }

        .wrapper {
            width: 420px;
            padding: 48px 40px;
            background: #ffffff;
            box-shadow: 0 8px 40px rgba(0,0,0,.1);
            border-radius: 14px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #ea580c, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .wrapper h2 {
            margin-bottom: 28px;
            font-size: 20px;
            color: #111827;
            font-weight: 700;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            color: #111827;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
            font-family: 'Noto Sans TC', Arial, sans-serif;
        }

        .input-group input:focus {
            border-color: #ea580c;
            box-shadow: 0 0 0 3px rgba(234,88,12,.12);
            background: #fff;
        }

        .input-group input::placeholder {
            color: #9ca3af;
        }

        .remember {
            margin-bottom: 20px;
            text-align: left;
        }

        .remember label {
            cursor: pointer;
            font-size: 14px;
            color: #6b7280;
        }

        .remember input {
            margin-right: 8px;
            accent-color: #ea580c;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ea580c;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            transition: all 0.2s ease-in-out;
            display: block;
            font-family: 'Noto Sans TC', Arial, sans-serif;
        }

        button:hover {
            background: #c2410c;
            box-shadow: 0 4px 16px rgba(234,88,12,.3);
        }

        .signUp-link {
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        }

        .signUp-link a {
            color: #ea580c;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease-in-out;
        }

        .signUp-link a:hover {
            color: #c2410c;
        }

        #errorMsg {
            color: #dc2626;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            padding: 8px 12px;
        }
    </style>
    <link rel="stylesheet" href="/theme.css">
</head>
<body class="auth-page">
    <div class="wrapper">
        <div class="auth-kicker">MEMBER ACCESS</div>
        <div class="brand">健身工作坊</div>
        <form id="loginForm">
            <h2>會員登入</h2>
            <div class="input-group">
                <input type="text" id="loginUsername" name="username" required maxlength="50" autocomplete="username" aria-label="帳號" placeholder="請輸入帳號">
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" name="password" required autocomplete="current-password" aria-label="密碼" placeholder="請輸入密碼">
            </div>
            <button type="submit" id="loginButton">登入</button>
            <p id="errorMsg" role="alert" aria-live="polite"></p>
            <div class="signUp-link">
                <p>還沒有帳號？ <a href="/signuppage">立即註冊</a></p>
            </div>
        </form>
    </div>

    <script>
        async function login(event) {
            event.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const button = document.getElementById('loginButton');

            errorMsg.classList.remove('success');
            errorMsg.style.display = 'none';
            if (!username || !password) {
                errorMsg.textContent = '請輸入完整的帳號和密碼';
                errorMsg.style.display = 'block';
                return;
            }

            button.disabled = true;
            button.textContent = '登入中…';
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 帳號: username, 密碼: password })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || !data.success) throw new Error(data.message || '登入失敗，請稍後再試');

                const next = new URLSearchParams(window.location.search).get('next') || '/start1.html';
                window.location.assign(next.startsWith('/') && !next.startsWith('//') ? next : '/start1.html');
            } catch (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
                button.disabled = false;
                button.textContent = '登入';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', login);
        if (new URLSearchParams(window.location.search).get('registered') === '1') {
            const message = document.getElementById('errorMsg');
            message.textContent = '帳號建立成功，現在可以登入了。';
            message.classList.add('success');
            message.style.display = 'block';
        }
    </script>
</body>
</html>
