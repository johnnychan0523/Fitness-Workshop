<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johnny 醫師 - 健身工作坊</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', Arial, sans-serif; background: #f9fafb; color: #111827; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      margin: 32px 40px; padding: 9px 18px;
      border: 1px solid #e5e7eb; border-radius: 8px;
      color: #6b7280; text-decoration: none; font-size: 14px;
      transition: all .2s; background: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .back-btn:hover { border-color: #ea580c; color: #ea580c; }

    .profile-wrap {
      max-width: 860px; margin: 0 auto; padding: 0 24px 80px;
      display: flex; gap: 48px; align-items: flex-start;
    }

    .profile-left { flex-shrink: 0; text-align: center; }
    .avatar {
      width: 160px; height: 160px; border-radius: 50%;
      background: linear-gradient(135deg, #ea580c, #f97316);
      display: flex; align-items: center; justify-content: center;
      font-size: 64px; font-weight: 700; color: #fff;
      margin: 0 auto 20px; overflow: hidden;
    }
    .avatar img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .coach-name { font-size: 24px; font-weight: 700; color: #111827; }
    .coach-role {
      display: inline-block; margin-top: 10px;
      font-size: 13px; padding: 4px 14px; border-radius: 20px;
      background: rgba(234,88,12,.1); color: #ea580c;
      border: 1px solid rgba(234,88,12,.2);
    }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .tag {
      font-size: 12px; padding: 3px 10px; border-radius: 20px;
      background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb;
    }

    .profile-right { flex: 1; }
    .section-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
      color: #ea580c; margin-bottom: 16px;
    }
    .bio-title {
      font-size: 28px; font-weight: 700; margin-bottom: 24px;
      background: linear-gradient(135deg, #ea580c, #f97316);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .bio p {
      font-size: 15px; color: #6b7280; line-height: 1.9; margin-bottom: 16px;
    }

    .divider { width: 1px; background: #e5e7eb; align-self: stretch; }

    @media (max-width: 680px) {
      .profile-wrap { flex-direction: column; align-items: center; }
      .divider { display: none; }
      .back-btn { margin: 20px 16px; }
    }

    footer { text-align: center; padding: 28px; color: #6b7280; font-size: 14px; border-top: 1px solid #e5e7eb; margin-top: 40px; }
  </style>
</head>
<body>
<script src="/nav.js"></script>

<a class="back-btn" href="/index1.html">← 返回教練介紹</a>

<div class="profile-wrap">
  <div class="profile-left">
    <div class="avatar">
      <img src="/img/johnny.jpg" alt="Johnny 醫師" onerror="this.style.display='none';this.parentElement.textContent='J'">
    </div>
    <div class="coach-name">Johnny 醫師</div>
    <div class="coach-role">營養師</div>
    <div class="tags">
      <span class="tag">飲食計劃</span>
      <span class="tag">營養諮詢</span>
      <span class="tag">體重管理</span>
      <span class="tag">健康促進</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="profile-right">
    <div class="section-label">Coach Profile</div>
    <div class="bio-title">營養師介紹</div>
    <div class="bio">
      <p>Johnny 醫師是我們的營養專家，擁有豐富的營養學知識和實踐經驗。他致力於幫助客戶制定健康的飲食計劃，並提供個性化的營養建議，以達到他們的健康目標。</p>
      <p>Johnny 醫師是我們團隊中不可或缺的一員，他的專業知識和溫暖的態度使他成為我們客戶信賴的夥伴。無論是增肌、減脂還是改善整體健康狀況，他都能提供最適合的飲食策略。</p>
    </div>
  </div>
</div>

<footer>&copy; 2024 健身工作坊. All rights reserved.</footer>
</body>
</html>
