<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>徒步訓練 - 健身工作坊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', Arial, sans-serif;
            background-color: #f9fafb;
            color: #111827;
            margin: 0;
            padding: 0;
        }
        .back-link {
            display: block;
            max-width: 860px;
            margin: 24px auto;
            padding: 0 20px;
        }
        .back-link a {
            display: inline-flex; align-items: center; gap: 6px;
            text-decoration: none; color: #ea580c; font-size: 14px;
            font-family: 'Noto Sans TC', Arial, sans-serif;
            transition: color .2s;
        }
        .back-link a:hover { color: #c2410c; }
        section {
            margin: 32px auto;
            max-width: 800px;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            background: linear-gradient(135deg, #ea580c, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
        .exercise {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            padding: 24px;
            margin-bottom: 20px;
            transition: box-shadow .2s, border-color .2s;
        }
        .exercise:hover {
            border-color: rgba(234,88,12,.4);
            box-shadow: 0 4px 16px rgba(234,88,12,.1);
        }
        h2 {
            color: #ea580c;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p {
            color: #374151;
            line-height: 1.8;
            font-size: 15px;
        }
        .exercise a {
            display: inline-block;
            margin-top: 12px;
            color: #ea580c;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color .2s;
        }
        .exercise a:hover { color: #c2410c; }
        footer { text-align: center; padding: 28px; color: #6b7280; font-size: 14px; border-top: 1px solid #e5e7eb; margin-top: 40px; }
    </style>
</head>
<body>
<script src="/nav.js"></script>
<div class="back-link">
  <a href="/class/course.html">← 返回課程介紹</a>
</div>
    <section id="walking">
        <h1>徒步訓練</h1>
        <div class="exercise">
            <h2>快步走</h2>
            <p>快速行走，保持步伐平穩，挺直腰背，手臂自然搖擺，每次訓練至少持續30分鐘。</p>
            <a href="https://youtu.be/-3xgkaKrdj0?si=upepPeIkQ9pjxetT">影片請點這裡</a>
        </div>
        <div class="exercise">
            <h2>登山步行</h2>
            <p>選擇有坡度的路線，步行上山，注重呼吸和姿勢，每次訓練至少持續30分鐘。</p>
            <a href="https://youtu.be/W5axeyc2PAs?si=7BE5-NI61JIRY4s2">影片請點這裡</a>
        </div>
        <div class="exercise">
            <h2>徒步旅行</h2>
            <p>計畫一段適合的徒步旅行路線，享受自然風景，每次訓練至少持續1小時。</p>
            <a href="https://youtu.be/HuRbMBrCoCA?si=IhjBDpCN_xIwdi_d">影片請點這裡</a>
        </div>
        <div class="exercise">
            <h2>步行休閒</h2>
            <p>在公園或郊區散步，放鬆心情，每次訓練至少持續20分鐘。</p>
            <a href="https://youtu.be/Ti23Il7uuqE?si=kgfg38se1YS9mt7s">影片請點這裡</a>
        </div>
    </section>
<footer>&copy; 2024 健身工作坊. All rights reserved.</footer>
</body>
</html>
