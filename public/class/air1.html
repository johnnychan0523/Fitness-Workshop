<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慢跑訓練 - 健身工作坊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', Arial, sans-serif;
            background-color: #f9fafb;
            color: #111827;
            margin: 0;
            padding: 0;
        }
        .back-link {
            display: block;
            max-width: 860px;
            margin: 24px auto;
            padding: 0 20px;
        }
        .back-link a {
            display: inline-flex; align-items: center; gap: 6px;
            text-decoration: none; color: #ea580c; font-size: 14px;
            font-family: 'Noto Sans TC', Arial, sans-serif;
            transition: color .2s;
        }
        .back-link a:hover { color: #c2410c; }
        section {
            margin: 32px auto;
            max-width: 800px;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            background: linear-gradient(135deg, #ea580c, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
        .exercise {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            padding: 24px;
            margin-bottom: 20px;
            transition: box-shadow .2s, border-color .2s;
        }
        .exercise:hover {
            border-color: rgba(234,88,12,.4);
            box-shadow: 0 4px 16px rgba(234,88,12,.1);
        }
        h2 {
            color: #ea580c;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p {
            color: #374151;
            line-height: 1.8;
            font-size: 15px;
        }
        .exercise a {
            display: inline-block;
            margin-top: 12px;
            color: #ea580c;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color .2s;
        }
        .exercise a:hover { color: #c2410c; }
        footer { text-align: center; padding: 28px; color: #6b7280; font-size: 14px; border-top: 1px solid #e5e7eb; margin-top: 40px; }
    </style>
</head>
<body>
<script src="/nav.js"></script>
<div class="back-link">
  <a href="/class/course.html">← 返回課程介紹</a>
</div>
    <section id="running">
        <h1>慢跑訓練</h1>
        <div class="exercise">
            <h2>準備姿勢</h2>
            <p>站直，保持身體挺直，肩膀放鬆，手臂自然擺動。</p>
        </div>
        <div class="exercise">
            <h2>起步慢跑</h2>
            <p>以輕鬆的步伐開始慢跑，注意呼吸與步伐的配合。</p>
        </div>
        <div class="exercise">
            <h2>提速慢跑</h2>
            <p>加快步伐，但仍保持舒適的節奏，注意保持呼吸均勻。</p>
        </div>
        <div class="exercise">
            <h2>冷卻步行</h2>
            <p>結束慢跑後，進行輕鬆的步行，讓身體逐漸恢復正常狀態。</p>
        </div>
        <a href="https://youtu.be/jfOeaWGvxjU?si=2jI2KqaPq41tdcGz" style="display:inline-block;margin:0 0 32px 20px;color:#ea580c;text-decoration:none;font-size:14px;font-weight:600">影片請點這裡</a>
    </section>
<footer>&copy; 2024 健身工作坊. All rights reserved.</footer>
</body>
</html>
