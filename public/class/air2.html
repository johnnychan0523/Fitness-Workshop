<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游泳訓練 - 健身工作坊</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', Arial, sans-serif;
            background-color: #f9fafb;
            color: #111827;
            margin: 0;
            padding: 0;
        }
        .back-link {
            display: block;
            max-width: 860px;
            margin: 24px auto;
            padding: 0 20px;
        }
        .back-link a {
            display: inline-flex; align-items: center; gap: 6px;
            text-decoration: none; color: #ea580c; font-size: 14px;
            font-family: 'Noto Sans TC', Arial, sans-serif;
            transition: color .2s;
        }
        .back-link a:hover { color: #c2410c; }
        section {
            margin: 32px auto;
            max-width: 800px;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            background: linear-gradient(135deg, #ea580c, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
        .exercise {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            padding: 24px;
            margin-bottom: 20px;
            transition: box-shadow .2s, border-color .2s;
        }
        .exercise:hover {
            border-color: rgba(234,88,12,.4);
            box-shadow: 0 4px 16px rgba(234,88,12,.1);
        }
        h2 {
            color: #ea580c;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p {
            color: #374151;
            line-height: 1.8;
            font-size: 15px;
        }
        .exercise a {
            display: inline-block;
            margin-top: 12px;
            color: #ea580c;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color .2s;
        }
        .exercise a:hover { color: #c2410c; }
        footer { text-align: center; padding: 28px; color: #6b7280; font-size: 14px; border-top: 1px solid #e5e7eb; margin-top: 40px; }
    </style>
</head>
<body>
<script src="/nav.js"></script>
<div class="back-link">
  <a href="/class/course.html">← 返回課程介紹</a>
</div>
    <section id="swimming">
        <h1>游泳訓練</h1>
        <div class="exercise">
            <h2>自由式</h2>
            <p>俯臥在水中，用手臂輪流划水，同時踢動雙腿，保持呼吸均勻，享受游泳的愉悅。</p>
            <a href="https://youtu.be/rOXw2ivFWME?si=ZWzKgpUIqB5zrMLK">影片請點這裡</a>
        </div>
        <div class="exercise">
            <h2>蝶式</h2>
            <p>雙手同時划水，踢動雙腿，保持身體水平，呼吸配合動作，享受蝶式的挑戰。</p>
            <a href="https://youtu.be/zegoCmtJLag?si=knGUUpcO58wljr50">影片請點這裡</a>
        </div>
        <div class="exercise">
            <h2>仰泳</h2>
            <p>仰臥在水中，用雙臂輪流划水，同時踢動雙腿，保持呼吸均勻，享受仰泳的舒適。</p>
            <a href="https://youtu.be/41JshapBUpc?si=HLbau_Fw1JXkqHHe">影片請點這裡</a>
        </div>
        <div class="exercise">
            <h2>蛙泳</h2>
            <p>踩水站立，雙手交替向前伸展，同時踢動雙腿，保持呼吸均勻，享受蛙泳的輕鬆。</p>
            <a href="https://youtu.be/gop701ydhMY?si=VB_LBxUhbSJOSI0g">影片請點這裡</a>
        </div>
    </section>
<footer>&copy; 2024 健身工作坊. All rights reserved.</footer>
</body>
</html>
