<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans TC', Arial, sans-serif;
            background-color: #f9fafb;
            color: #111827;
            margin: 0;
            padding: 0;
        }
        .back-link {
            display: block;
            max-width: 860px;
            margin: 24px auto;
            padding: 0 20px;
        }
        .back-link a {
            display: inline-flex; align-items: center; gap: 6px;
            text-decoration: none; color: #ea580c; font-size: 14px;
            font-family: 'Noto Sans TC', Arial, sans-serif;
            transition: color .2s;
        }
        .back-link a:hover { color: #c2410c; }
        section {
            margin: 32px auto;
            max-width: 800px;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            background: linear-gradient(135deg, #ea580c, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: clamp(22px, 4vw, 30px);
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
        .exercise {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
            padding: 24px;
            margin-bottom: 20px;
            transition: box-shadow .2s, border-color .2s;
        }
        .exercise:hover {
            border-color: rgba(234,88,12,.4);
            box-shadow: 0 4px 16px rgba(234,88,12,.1);
        }
        h2 {
            color: #ea580c;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p {
            color: #374151;
            line-height: 1.8;
            font-size: 15px;
        }
        .exercise a {
            display: inline-block;
            margin-top: 12px;
            color: #ea580c;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color .2s;
        }
        .exercise a:hover { color: #c2410c; }
        footer { text-align: center; padding: 28px; color: #6b7280; font-size: 14px; border-top: 1px solid #e5e7eb; margin-top: 40px; }
    </style>
</head>
<body>
<script src="/nav.js"></script>
<div class="back-link">
  <a href="/class/course.html">← 返回課程介紹</a>
</div>
    <section id="yoga">
        <h1>瑜珈訓練</h1>
        <div class="exercise">
            <h2>下犬式</h2>
            <p>雙手和雙腳平放於地面，臀部向上抬起，身體形成倒V字型，保持呼吸均勻，放鬆頭部。</p>
            <a href="https://youtu.be/YwFOL6vFfhE?si=u1-x3E1Wwv1s1hEU">影片請點這裡</a>
        </div>
        <div class="exercise">
            <h2>戰士式</h2>
            <p>雙腿分開，右腳向前迈出，左腳向後伸直，雙臂向上伸直，呼吸均勻，感受腰部和背部的伸展。</p>
            <a href="https://youtu.be/BKWN3VXc8hw?si=yqShQqubrG0Mpz80">影片請點這裡</a>
        </div>
        <div class="exercise">
            <h2>平衡式</h2>
            <p>站立，將左腳膝蓋抬起，將左手手掌與右腳膝蓋相觸，右手向上伸直，保持平衡，重複於另一邊。</p>
            <a href="https://youtu.be/zenQT8jt5B8?si=8BFVsnM7aDOcifjw">影片請點這裡</a>
        </div>
        <div class="exercise">
            <h2>猫式</h2>
            <p>跪姿，雙手和雙膝放於地面，背部上彎，頭部向下低垂，呼吸均勻，感受背部的伸展。</p>
            <a href="https://youtu.be/-DOF3IuvnH4?si=Pwm-WffwIGv92X3D">影片請點這裡</a>
        </div>
    </section>
<footer>&copy; 2024 健身工作坊. All rights reserved.</footer>
</body>
</html>
