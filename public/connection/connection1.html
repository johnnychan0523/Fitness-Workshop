<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們 - 健身工作坊</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans TC', Arial, sans-serif; background: #f9fafb; color: #111827; }

    .page-header {
      text-align: center;
      padding: 60px 20px 40px;
      border-bottom: 1px solid #e5e7eb;
    }
    .page-header h1 {
      font-size: 40px;
      font-weight: 700;
      background: linear-gradient(135deg, #ea580c, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .page-header p { color: #6b7280; margin-top: 12px; font-size: 16px; }

    .container { max-width: 800px; margin: 0 auto; padding: 48px 20px 80px; }

    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }

    .info-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color .25s;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .info-card:hover { border-color: rgba(234,88,12,.4); box-shadow: 0 4px 16px rgba(234,88,12,.1); }
    .info-icon { font-size: 28px; }
    .info-label { font-size: 12px; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
    .info-value { font-size: 16px; font-weight: 600; color: #111827; }

    .feedback-box {
      background: rgba(234,88,12,.08);
      border: 1px solid rgba(234,88,12,.2);
      border-radius: 14px;
      padding: 36px;
      text-align: center;
    }
    .feedback-box h2 { font-size: 22px; margin-bottom: 10px; font-weight: 700; color: #111827; }
    .feedback-box p { color: #6b7280; font-size: 15px; margin-bottom: 24px; line-height: 1.7; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #ea580c;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      transition: all .25s;
    }
    .btn:hover { background: #c2410c; box-shadow: 0 4px 20px rgba(234,88,12,.3); }

    footer { text-align: center; padding: 28px; color: #6b7280; font-size: 14px; border-top: 1px solid #e5e7eb; }
  </style>
</head>
<body>
<script src="/nav.js"></script>

<div class="page-header">
  <h1>聯絡我們</h1>
  <p>有任何問題都歡迎與我們聯繫，我們竭誠為您服務</p>
</div>

<div class="container">
  <div class="info-grid">
    <div class="info-card">
      <div class="info-icon">📞</div>
      <div class="info-label">聯絡電話</div>
      <div class="info-value">0968-893-150</div>
    </div>
    <div class="info-card">
      <div class="info-icon">📅</div>
      <div class="info-label">服務方式</div>
      <div class="info-value">採預約制</div>
    </div>
    <div class="info-card">
      <div class="info-icon">📍</div>
      <div class="info-label">到訪提醒</div>
      <div class="info-value">場地資訊請先來電確認</div>
    </div>
  </div>

  <div class="feedback-box">
    <h2>填寫回饋問卷</h2>
    <p>您的意見是我們進步的動力！<br>歡迎告訴我們您的使用感受與改進建議。</p>
    <a class="btn" href="comment.html">填寫問卷</a>
  </div>
</div>

<footer>&copy; 2024 健身工作坊. All rights reserved.</footer>
</body>
</html>
